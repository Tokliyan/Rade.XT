name: Backtest Stats

on:
  schedule:
    - cron: "0 20 * * 0"   # weekly, Sunday 20:00 UTC — history doesn't change fast
  workflow_dispatch: {}

jobs:
  compute-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compute historical ranges
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python backtest_stats.py
