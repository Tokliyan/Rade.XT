name: Evolve News Download

# Manual-only. Downloads daily news word counts (Wikipedia current events, keyless) in ~2 minutes using batch mode,
# then audits a random sample of days against the exact point-in-time pages to measure any hindsight leak.
# Commits the small csv files back to the repo.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Time budget in minutes for each step"
        default: "5"

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: Download news counts (batch mode)
        working-directory: research/evolution
        run: python news.py --mode batch --start 2004-01-01 --minutes ${{ github.event.inputs.minutes || '5' }} --out data/news_counts.csv
      - name: Audit against exact point-in-time pages
        working-directory: research/evolution
        run: python news.py --mode audit --audit 200 --minutes ${{ github.event.inputs.minutes || '5' }} --out data/news_counts.csv --pit data/news_pit.csv
      - name: Commit csv
        run: |
          git config user.name "rade-xt-research"
          git config user.email "research@users.noreply.github.com"
          git add research/evolution/data/
          git diff --cached --quiet || git commit -m "Evolution research: news counts + audit"
          git pull --rebase -q origin main || true
          git push -q origin HEAD:main || true
