name: Evolve News Download

# Manual-only. Downloads daily news word counts (Wikipedia current events, keyless) as TRUE point-in-time pages
# (the page exactly as it stood at the end of each day), capped at ~9 minutes and resumable.
# Commits the small csv files back to the repo.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Time budget in minutes for each step"
        default: "9"

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas requests
      - name: Download point-in-time news counts (every 4th day from 2009, daily 2006-2009 already cached)
        working-directory: research/evolution
        run: python news.py --mode pit --start 2009-03-01 --step 4 --minutes ${{ github.event.inputs.minutes || '9' }} --workers 4 --out data/news_pit.csv
      - name: Commit csv
        run: |
          git config user.name "rade-xt-research"
          git config user.email "research@users.noreply.github.com"
          git add research/evolution/data/
          git diff --cached --quiet || git commit -m "Evolution research: news counts + audit"
          git pull --rebase -q origin main || true
          git push -q origin HEAD:main || true
