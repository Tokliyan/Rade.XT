name: Trading Bot

on:
  schedule:
    # Every 15 minutes — 5 min is GitHub's actual floor, but the
    # strategies read 1-hour candles, so checking faster than that never
    # produces a NEW signal. 15 min is the sweet spot: meaningfully
    # faster stop-loss/take-profit reaction on an open position (that
    # part checks live price, not just the candle), without burning
    # runs on redundant re-checks of the same hourly data.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

jobs:
  run-agents:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        agent: [asx_bluechip_steady, asx_smallcap_growth, crypto_store_of_value]
      fail-fast: false   # one agent erroring shouldn't cancel the others
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          CONFIRM_LIVE_TRADING: ${{ secrets.CONFIRM_LIVE_TRADING }}
        run: python main.py --agent ${{ matrix.agent }}
