<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14161c;
    --panel: #1b1e26;
    --panel-raised: #21252f;
    --hairline: #2b2f3a;
    --hairline-strong: #3a3f4d;
    --text: #e7e5dd;
    --text-dim: #9297a6;
    --text-faint: #656b7a;
    --gain: #5fb98d;
    --loss: #d1685a;
    --paused: #d1a24a;
    --font-ui: "IBM Plex Sans", system-ui, sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--hairline);
  }
  header h1 { font-size: 20px; font-weight: 500; margin: 0; }
  header .meta { font-size: 13px; color: var(--text-faint); font-family: var(--font-num); }

  .totals {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  .totals .cell {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 14px 16px;
  }
  .totals .label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .totals .value { font-family: var(--font-num); font-size: 22px; font-weight: 500; }

  .agents {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
    margin-bottom: 36px;
  }
  .agent-card {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 18px 18px 14px;
  }
  .agent-card .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }
  .agent-card .name { font-size: 15px; font-weight: 500; }
  .agent-card .strategy { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
  .status {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 3px;
    border: 1px solid;
    white-space: nowrap;
  }
  .status.active { color: var(--gain); border-color: var(--gain); }
  .status.paused { color: var(--paused); border-color: var(--paused); }

  .equity-row { display: flex; align-items: baseline; gap: 10px; margin: 14px 0 2px; }
  .equity-row .equity { font-family: var(--font-num); font-size: 26px; font-weight: 500; }
  .equity-row .delta { font-family: var(--font-num); font-size: 13px; }
  .delta.up { color: var(--gain); }
  .delta.down { color: var(--loss); }
  .delta.flat { color: var(--text-faint); }

  .sparkline { width: 100%; height: 48px; display: block; margin: 10px 0 12px; }

  .positions { font-size: 12px; color: var(--text-dim); border-top: 1px solid var(--hairline); padding-top: 10px; }
  .positions .row { display: flex; justify-content: space-between; padding: 2px 0; font-family: var(--font-num); }
  .positions .empty { color: var(--text-faint); font-family: var(--font-ui); }

  .market { font-size: 12px; color: var(--text-dim); border-top: 1px solid var(--hairline); padding-top: 10px; margin-top: 10px; }
  .market .row { display: flex; justify-content: space-between; padding: 2px 0; font-family: var(--font-num); }
  .market .chg-up { color: var(--gain); }
  .market .chg-down { color: var(--loss); }
  .market .note { font-family: var(--font-ui); color: var(--text-faint); font-size: 11px; margin-top: 6px; }

  .hist-range { font-size: 12px; border-top: 1px solid var(--hairline); padding-top: 10px; margin-top: 10px; }
  .hist-range .label { color: var(--text-dim); margin-bottom: 4px; }
  .hist-range .range { font-family: var(--font-num); color: var(--text); }
  .hist-range .caption { color: var(--text-faint); font-size: 11px; margin-top: 4px; }

  .risk-profile { border-top: 1px solid var(--hairline); padding-top: 10px; margin-top: 10px; }
  .risk-profile .label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .profile-btns { display: flex; gap: 6px; }
  .profile-btn {
    flex: 1;
    font-family: var(--font-ui);
    font-size: 11px;
    padding: 6px 4px;
    border-radius: 4px;
    border: 1px solid var(--hairline-strong);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
  }
  .profile-btn:hover { border-color: var(--text-dim); }
  .profile-btn.active { border-color: var(--gain); color: var(--gain); background: rgba(95,185,141,0.08); }
  .profile-btn:disabled { opacity: 0.5; cursor: default; }


  .digest { background: var(--panel); border: 1px solid var(--hairline); border-left: 3px solid var(--gain); border-radius: 6px; padding: 14px 16px; margin-bottom: 28px; }
  .digest .label { font-size: 11px; color: var(--text-faint); margin-bottom: 6px; font-family: var(--font-num); }
  .digest .text { font-size: 14px; line-height: 1.55; color: var(--text); }

  .chart-box { border-top: 1px solid var(--hairline); padding-top: 10px; margin-top: 10px; }
  .chart-tabs { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .chart-tab { font-family: var(--font-num); font-size: 11px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--hairline-strong); background: transparent; color: var(--text-dim); cursor: pointer; }
  .chart-tab.active { border-color: var(--gain); color: var(--gain); }
  canvas.candles { width: 100%; height: 130px; display: block; }
  .chart-caption { font-size: 11px; color: var(--text-faint); margin-top: 4px; }

  details.fund { border-top: 1px solid var(--hairline); padding-top: 10px; margin-top: 10px; font-size: 12px; }
  details.fund summary { color: var(--text-dim); cursor: pointer; }
  details.fund .sym { color: var(--text); font-family: var(--font-num); margin: 10px 0 4px; }
  details.fund .row { display: flex; justify-content: space-between; padding: 2px 0; font-family: var(--font-num); color: var(--text-dim); }
  details.fund .bar { height: 4px; background: var(--hairline); border-radius: 2px; margin: 4px 0 2px; position: relative; }
  details.fund .bar i { position: absolute; top: -3px; width: 2px; height: 10px; background: var(--text); }
  details.fund .caption { color: var(--text-faint); font-size: 11px; margin-top: 6px; }

  h2 { font-size: 15px; font-weight: 500; margin: 0 0 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    font-weight: 500;
    color: var(--text-faint);
    font-size: 11px;
    padding: 0 10px 8px;
    border-bottom: 1px solid var(--hairline);
  }
  tbody td { padding: 8px 10px; border-bottom: 1px solid var(--hairline); font-family: var(--font-num); }
  tbody tr:last-child td { border-bottom: none; }
  td.side-buy { color: var(--gain); }
  td.side-sell { color: var(--loss); }
  td.agent-col { font-family: var(--font-ui); color: var(--text-dim); }

  .empty-state { color: var(--text-faint); font-size: 13px; padding: 24px 0; }
  .error-state { color: var(--loss); font-size: 13px; padding: 16px; background: var(--panel); border: 1px solid var(--hairline); border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Agent desk</h1>
    <span class="meta" id="last-updated">loading…</span>
  </header>

  <div id="digest"></div>

  <div class="totals" id="totals"></div>

  <div class="agents" id="agents">
    <div class="empty-state">Loading agents…</div>
  </div>

  <h2>Recent trades</h2>
  <table>
    <thead>
      <tr><th>Time (UTC)</th><th>Agent</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Price</th></tr>
    </thead>
    <tbody id="trades-body">
      <tr><td colspan="6" class="empty-state">Loading trades…</td></tr>
    </tbody>
  </table>

</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // Fill these in with your Supabase project URL and the PUBLIC ANON key —
  // never the service role key. The anon key can only read (see
  // supabase_schema.sql's row-level security policies), so it's safe to
  // ship in this client-side file even though anyone can view it.
  const SUPABASE_URL = 'https://tisvvyjhfkuhcxljcqog.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_eQtK7Jyrn6_8aKj_kFiXvg_oceg0vrd';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const STRATEGY_LABELS = {
    asx_bluechip_steady: 'SMA crossover — ASX blue chips',
    asx_smallcap_growth: 'RSI mean reversion — ASX small caps',
    crypto_store_of_value: 'SMA crossover — BTC + gold token',
    news_sentiment_asx: 'Claude news sentiment — ASX ($)',
    news_sentiment_crypto: 'Claude news sentiment — BTC ($)',
  };

  const PROFILES = ['conservative', 'balanced', 'aggressive'];
  const PROFILE_LABELS = { conservative: 'Safe', balanced: 'Balanced', aggressive: 'All-in' };
  const NOT_BACKTESTABLE = new Set(['news_sentiment_asx', 'news_sentiment_crypto']);

  async function setRiskProfile(agentName, profile, btnGroup) {
    Array.from(btnGroup.children).forEach(b => b.disabled = true);
    try {
      // Points at the actual deployed function's address — Supabase's
      // dashboard let the display name be "set-risk-profile" while the
      // real route underneath stayed "smart-handler" (whatever the
      // template was originally called), so this has to match that, not
      // the friendly label shown in the Edge Functions list.
      const { error } = await supabase.functions.invoke('smart-handler', {
        body: { agent_name: agentName, risk_profile: profile },
      });
      if (error) throw error;
      await load(); // refresh everything so the new active state shows immediately
    } catch (err) {
      alert('Could not change risk profile: ' + err.message);
      Array.from(btnGroup.children).forEach(b => b.disabled = false);
    }
  }

  function fmtUsd(n) {
    return '$' + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function drawSparkline(canvas, values) {
    if (!values.length) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.clientWidth * 2;
    const h = canvas.height = canvas.clientHeight * 2;
    ctx.scale(1, 1);
    const min = Math.min(...values), max = Math.max(...values);
    const range = max - min || 1;
    const rising = values[values.length - 1] >= values[0];
    ctx.strokeStyle = rising ? '#5fb98d' : '#d1685a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    values.forEach((v, i) => {
      const x = (i / (values.length - 1 || 1)) * w;
      const y = h - ((v - min) / range) * (h - 8) - 4;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
  }


  function esc(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function fmtPrice(n) {
    const v = Number(n);
    const d = v >= 100 ? 2 : v >= 1 ? 3 : 5;
    return v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: d });
  }

  function fmtBig(n) {
    const v = Number(n);
    if (v >= 1e12) return (v / 1e12).toFixed(2) + 'T';
    if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
    if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
    return v.toLocaleString();
  }

  // Candles arrive as [unix_seconds, open, high, low, close] rows.
  function drawCandles(canvas, candles, entryPrice) {
    const dpr = window.devicePixelRatio || 1;
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    if (!cw || !ch) return;
    canvas.width = cw * dpr;
    canvas.height = ch * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, cw, ch);
    if (!candles || !candles.length) return;

    const padR = 58, padT = 6, padB = 6;
    const plotW = cw - padR, plotH = ch - padT - padB;
    let lo = Math.min(...candles.map(c => c[3])), hi = Math.max(...candles.map(c => c[2]));
    if (entryPrice) { lo = Math.min(lo, entryPrice); hi = Math.max(hi, entryPrice); }
    const span = (hi - lo) || (hi * 0.01) || 1;
    lo -= span * 0.04; hi += span * 0.04;
    const y = v => padT + (1 - (v - lo) / (hi - lo)) * plotH;
    const slot = plotW / candles.length;
    const bodyW = Math.max(1, Math.min(10, slot * 0.65));

    // light grid + price labels
    ctx.font = '10px "IBM Plex Mono", monospace';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#656b7a';
    ctx.strokeStyle = '#2b2f3a';
    ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      const v = lo + (hi - lo) * (i / 3);
      const yy = Math.round(y(v)) + 0.5;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(plotW, yy); ctx.stroke();
      ctx.fillText(v >= 1000 ? Math.round(v).toLocaleString() : fmtPrice(v), plotW + 4, yy);
    }

    candles.forEach((c, i) => {
      const [, o, h, l, cl] = c;
      const x = i * slot + slot / 2;
      const up = cl >= o;
      ctx.strokeStyle = ctx.fillStyle = up ? '#5fb98d' : '#d1685a';
      ctx.beginPath(); ctx.moveTo(x, y(h)); ctx.lineTo(x, y(l)); ctx.stroke();
      const top = y(Math.max(o, cl)), bh = Math.max(1, Math.abs(y(o) - y(cl)));
      ctx.fillRect(x - bodyW / 2, top, bodyW, bh);
    });

    if (entryPrice) {
      const yy = Math.round(y(entryPrice)) + 0.5;
      ctx.save();
      ctx.setLineDash([4, 3]);
      ctx.strokeStyle = '#d1a24a';
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(plotW, yy); ctx.stroke();
      ctx.restore();
      ctx.fillStyle = '#d1a24a';
      ctx.fillText('entry ' + fmtPrice(entryPrice), 4, Math.min(ch - 8, Math.max(8, yy - 8)));
    }
  }

  function fundamentalsHtml(symbols, fundBySymbol) {
    const blocks = symbols.filter(sym => fundBySymbol[sym]).map(sym => {
      const f = fundBySymbol[sym];
      const rows = [];
      if (f.name) rows.push(['Company', esc(f.name) + (f.sector ? ' · ' + esc(f.sector) : '')]);
      if (f.market_cap != null) rows.push(['Market cap', '$' + fmtBig(f.market_cap)]);
      if (f.pe_trailing != null) rows.push(['P/E (trailing)', Number(f.pe_trailing).toFixed(1)]);
      if (f.pe_forward != null) rows.push(['P/E (forward)', Number(f.pe_forward).toFixed(1)]);
      if (f.eps != null) rows.push(['EPS', Number(f.eps).toFixed(2)]);
      if (f.dividend_yield_pct != null) rows.push(['Dividend yield', Number(f.dividend_yield_pct).toFixed(2) + '%']);
      if (f.profit_margin_pct != null) rows.push(['Profit margin', Number(f.profit_margin_pct).toFixed(1) + '%']);
      if (f.beta != null) rows.push(['Beta', Number(f.beta).toFixed(2)]);
      let range = '';
      if (f.low_52w != null && f.high_52w != null) {
        const pos = f.pos_52w != null ? Math.round(f.pos_52w * 100) : null;
        range = `<div class="row"><span>52-week range</span><span>${fmtPrice(f.low_52w)} – ${fmtPrice(f.high_52w)}</span></div>
                 ${pos != null ? `<div class="bar"><i style="left:${pos}%"></i></div>` : ''}`;
      }
      return `<div class="sym">${esc(sym)}</div>` +
        rows.map(([k, v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`).join('') + range;
    });
    if (!blocks.length) return '';
    return `<details class="fund"><summary>Fundamentals</summary>${blocks.join('')}
      <div class="caption">Company numbers from Yahoo Finance, refreshed daily. For context only — the bots don't use them.</div></details>`;
  }

  // Extra panels are optional: if their tables aren't created yet (or a
  // request fails) the dashboard still works, just without them.
  async function loadOptional(table, build) {
    try {
      const { data, error } = await build(supabase.from(table));
      if (error) throw error;
      return data || [];
    } catch (e) {
      console.warn('optional panel skipped:', table, e.message || e);
      return [];
    }
  }

  let chartRedraws = [];
  window.addEventListener('resize', () => chartRedraws.forEach(f => f()));

  async function load() {
    const agentsEl = document.getElementById('agents');
    const totalsEl = document.getElementById('totals');
    const tradesBody = document.getElementById('trades-body');

    try {
      const [{ data: states, error: stateErr }, { data: trades, error: tradeErr },
             { data: settings, error: settingsErr }, { data: stats, error: statsErr }] = await Promise.all([
        supabase.from('agent_state').select('*'),
        supabase.from('trades').select('*').order('timestamp', { ascending: false }).limit(30),
        supabase.from('agent_settings').select('*'),
        supabase.from('backtest_stats').select('*'),
      ]);
      if (stateErr) throw stateErr;
      if (tradeErr) throw tradeErr;
      if (settingsErr) throw settingsErr;
      if (statsErr) throw statsErr;

      const [digests, fundRows] = await Promise.all([
        loadOptional('daily_digests', t => t.select('*').order('day', { ascending: false }).limit(1)),
        loadOptional('fundamentals', t => t.select('*')),
      ]);
      const fundBySymbol = Object.fromEntries(fundRows.map(r => [r.symbol, typeof r.data === 'string' ? JSON.parse(r.data) : (r.data || {})]));

      const digestEl = document.getElementById('digest');
      digestEl.innerHTML = digests.length
        ? `<div class="digest"><div class="label">DAILY DIGEST · ${esc(digests[0].day)}${digests[0].source === 'claude' ? ' · written by Claude' : ''}</div><div class="text">${esc(digests[0].summary)}</div></div>`
        : '';

      const settingsByAgent = Object.fromEntries((settings || []).map(s => [s.agent_name, s]));
      const statsByAgent = Object.fromEntries((stats || []).map(s => [s.agent_name, s]));

      document.getElementById('last-updated').textContent =
        'refreshed ' + new Date().toLocaleTimeString();

      // --- totals ---
      // Same fix as per-agent cards: equity = cash + value of whatever's
      // currently held, not cash alone.
      const totalEquity = (states || []).reduce((sum, s) => {
        const cash = Number(s.cash);
        const positions = typeof s.positions === 'string' ? JSON.parse(s.positions) : (s.positions || {});
        const marketSnapshot = typeof s.market_snapshot === 'string' ? JSON.parse(s.market_snapshot) : (s.market_snapshot || {});
        const positionValue = Object.entries(positions).reduce((psum, [sym, qty]) => {
          const price = marketSnapshot[sym] ? Number(marketSnapshot[sym].price) : 0;
          return psum + Number(qty) * price;
        }, 0);
        return sum + cash + positionValue;
      }, 0);
      const activeCount = (states || []).filter(s => !s.paused).length;
      totalsEl.innerHTML = `
        <div class="cell"><div class="label">Agents</div><div class="value">${(states || []).length}</div></div>
        <div class="cell"><div class="label">Active now</div><div class="value">${activeCount} / ${(states || []).length}</div></div>
        <div class="cell"><div class="label">Combined equity</div><div class="value">${fmtUsd(totalEquity)}</div></div>
      `;

      // --- agent cards ---
      if (!states || !states.length) {
        agentsEl.innerHTML = '<div class="empty-state">No agents have reported in yet. Once the GitHub Actions workflow runs, they\'ll show up here.</div>';
      } else {
        agentsEl.innerHTML = '';
        chartRedraws = [];
        for (const s of states) {
          const startBal = 100; // matches AgentConfig.starting_balance default
          const positions = typeof s.positions === 'string' ? JSON.parse(s.positions) : (s.positions || {});
          const marketSnapshot = typeof s.market_snapshot === 'string' ? JSON.parse(s.market_snapshot) : (s.market_snapshot || {});
          const agentTrades = (trades || []).filter(t => t.agent_name === s.agent_name).slice().reverse();
          const cash = Number(s.cash);
          // Equity = cash + whatever's currently held, priced at the latest
          // known market price. Cash alone drops the moment a position opens
          // even with zero loss, which made agents holding a stock look like
          // they'd crashed when the money had just moved, not vanished.
          const positionValue = Object.entries(positions).reduce((sum, [sym, qty]) => {
            const price = marketSnapshot[sym] ? Number(marketSnapshot[sym].price) : 0;
            return sum + Number(qty) * price;
          }, 0);
          const equity = cash + positionValue;
          const sparkValues = [startBal, ...agentTrades.map(t => Number(t.cash_after))];
          const delta = equity - startBal;
          const deltaClass = delta > 0 ? 'up' : delta < 0 ? 'down' : 'flat';
          const deltaSign = delta > 0 ? '+' : '';

          const posRows = Object.entries(positions).filter(([, qty]) => Number(qty) > 0);

          const marketRows = Object.entries(marketSnapshot);
          const chartSyms = Object.keys(marketSnapshot).filter(sym => Array.isArray(marketSnapshot[sym].candles) && marketSnapshot[sym].candles.length > 1);
          const entryPrices = typeof s.entry_prices === 'string' ? JSON.parse(s.entry_prices) : (s.entry_prices || {});

          const stat = statsByAgent[s.agent_name];
          const currentProfile = (settingsByAgent[s.agent_name] && settingsByAgent[s.agent_name].risk_profile) || 'balanced';

          const card = document.createElement('div');
          card.className = 'agent-card';
          card.innerHTML = `
            <div class="top">
              <div>
                <div class="name">${s.agent_name}</div>
                <div class="strategy">${STRATEGY_LABELS[s.agent_name] || 'custom strategy'}</div>
              </div>
              <span class="status ${s.paused ? 'paused' : 'active'}">${s.paused ? 'paused' : 'active'}</span>
            </div>
            <div class="equity-row">
              <span class="equity">${fmtUsd(equity)}</span>
              <span class="delta ${deltaClass}">${deltaSign}${fmtUsd(delta)}</span>
            </div>
            <canvas class="sparkline"></canvas>
            ${chartSyms.length ? `<div class="chart-box">
              <div class="chart-tabs"></div>
              <canvas class="candles"></canvas>
              <div class="chart-caption">Hourly candles, last ${marketSnapshot[chartSyms[0]].candles.length} bars. Green = closed up, red = closed down.</div>
            </div>` : ''}
            <div class="positions">
              ${posRows.length
                ? posRows.map(([sym, qty]) => {
                    const price = marketSnapshot[sym] ? Number(marketSnapshot[sym].price) : 0;
                    return `<div class="row"><span>${sym}</span><span>${Number(qty).toFixed(6)} (${fmtUsd(Number(qty) * price)})</span></div>`;
                  }).join('') + `<div class="row"><span>cash</span><span>${fmtUsd(cash)}</span></div>`
                : '<div class="empty">No open position — all cash</div>'}
            </div>
            <div class="market">
              ${marketRows.length
                ? marketRows.map(([sym, m]) => `<div class="row"><span>${sym}</span><span class="${m.change_pct >= 0 ? 'chg-up' : 'chg-down'}">${fmtUsd(m.price)} (${m.change_pct >= 0 ? '+' : ''}${m.change_pct}%)</span></div>`).join('')
                : '<div class="empty">No market data yet</div>'}
              ${s.market_note ? `<div class="note">${s.market_note}</div>` : ''}
            </div>
            ${fundamentalsHtml(Object.keys(marketSnapshot), fundBySymbol)}
            <div class="hist-range">
              <div class="label">Historical range (${stat ? stat.window_days : 14}-day windows)</div>
              ${NOT_BACKTESTABLE.has(s.agent_name)
                ? `<div class="caption">Not applicable — this strategy reads today's live news, so there's no way to replay what it would have said in the past. No historical range exists for it, by design.</div>`
                : stat
                  ? `<div class="range">${stat.min_return_pct >= 0 ? '+' : ''}${stat.min_return_pct}% to ${stat.max_return_pct >= 0 ? '+' : ''}${stat.max_return_pct}% &nbsp;·&nbsp; typical ${stat.median_return_pct >= 0 ? '+' : ''}${stat.median_return_pct}% &nbsp;·&nbsp; n=${stat.num_windows}</div>
                     <div class="caption">Real past data replayed through this strategy — not a forecast.</div>`
                  : `<div class="caption">Not computed yet — runs weekly.</div>`}
            </div>
            <div class="risk-profile">
              <div class="label">Risk profile</div>
              <div class="profile-btns"></div>
            </div>
          `;
          agentsEl.appendChild(card);
          drawSparkline(card.querySelector('.sparkline'), sparkValues);

          if (chartSyms.length) {
            const canvas = card.querySelector('canvas.candles');
            const tabs = card.querySelector('.chart-tabs');
            const show = sym => {
              Array.from(tabs.children).forEach(b => b.classList.toggle('active', b.dataset.sym === sym));
              const held = Number(positions[sym] || 0) > 0;
              drawCandles(canvas, marketSnapshot[sym].candles, held ? Number(entryPrices[sym]) || null : null);
            };
            chartSyms.forEach(sym => {
              const b = document.createElement('button');
              b.className = 'chart-tab';
              b.dataset.sym = sym;
              b.textContent = sym;
              b.onclick = () => show(sym);
              tabs.appendChild(b);
            });
            let current = chartSyms[0];
            const showTracked = sym => { current = sym; show(sym); };
            Array.from(tabs.children).forEach(b => { b.onclick = () => showTracked(b.dataset.sym); });
            show(current);
            chartRedraws.push(() => show(current));
            requestAnimationFrame(() => show(current)); // repaint once layout has settled
          }

          const btnGroup = card.querySelector('.profile-btns');
          PROFILES.forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'profile-btn' + (p === currentProfile ? ' active' : '');
            btn.textContent = PROFILE_LABELS[p];
            btn.onclick = () => setRiskProfile(s.agent_name, p, btnGroup);
            btnGroup.appendChild(btn);
          });
        }
      }

      // --- recent trades table ---
      if (!trades || !trades.length) {
        tradesBody.innerHTML = '<tr><td colspan="6" class="empty-state">No trades yet.</td></tr>';
      } else {
        tradesBody.innerHTML = trades.map(t => `
          <tr>
            <td>${new Date(t.timestamp).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</td>
            <td class="agent-col">${t.agent_name}</td>
            <td>${t.symbol}</td>
            <td class="side-${t.side.toLowerCase()}">${t.side}</td>
            <td>${Number(t.qty).toFixed(6)}</td>
            <td>${fmtUsd(t.price)}</td>
          </tr>
        `).join('');
      }
    } catch (err) {
      agentsEl.innerHTML = `<div class="error-state">Couldn't load data: ${err.message}. Check that SUPABASE_URL and SUPABASE_ANON_KEY are filled in at the top of this file's script.</div>`;
      totalsEl.innerHTML = '';
      tradesBody.innerHTML = '';
      document.getElementById('digest').innerHTML = '';
    }
  }

  load();
  setInterval(load, 60000); // auto-refresh every minute while the tab is open
</script>
</body>
</html>
